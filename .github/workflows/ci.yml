name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Don't redownload tokenizers on every shard; share HF cache between steps.
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
      # CPU bf16 of Qwen3-0.6B + backward is too slow for the full H1 smoke on
      # GitHub-hosted runners; gate H1 by setting DP_SMOKE_SKIP_H1=1.
      DP_SMOKE_SKIP_H1: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ runner.os }}-qwen3-0.6b

      - name: Build datasets
        run: python -m src.data

      - name: Smoke test (Qwen3-0.6B, no H1 backward)
        run: |
          pytest tests/test_smoke.py -v -s \
            -k "not h1_discover and not smoke_under_60s" \
            --maxfail=1

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            .pytest_cache/
            data/
